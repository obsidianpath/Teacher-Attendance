<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Журнал посещаемости</title>
  <link rel="stylesheet" href="./styles/themes.css" />
  <link rel="stylesheet" href="./styles/main.css" />
  <link rel="stylesheet" href="./styles/print.css" media="print" />
</head>
<body>
<!-- Фон для страниц авторизации -->
  <div id="particles-bg" class="particles-bg hidden"></div>
  
  <!-- Шапка (показывается только после входа) -->
  <header id="app-header" class="app-header hidden">
  <div class="header-left">
    <a href="#/dashboard" class="logo">
      <span class="logo-mark">📓</span>
      <span class="logo-text">Teacher-Attendance</span>
    </a>
  </div>

  <!-- Десктопное меню -->
  <nav class="header-nav" id="header-nav-desktop">
    <span id="user-name" class="user-name"></span>
    <span id="user-email" class="user-email"></span>
    <a href="#/admin" id="admin-link" class="nav-link hidden">
      <span class="nav-icon">🛡️</span> Админ
    </a>
    <a href="#/reports" class="nav-link">
      <span class="nav-icon">📊</span> Отчёты
    </a>
    <a href="#/settings" class="nav-link">
      <span class="nav-icon">⚙️</span> Настройки
    </a>
    <button id="theme-toggle" class="nav-link nav-btn" title="Сменить тему">
      <span class="nav-icon">🎨</span> Тема
    </button>
    <button id="logout-btn" class="nav-link nav-btn nav-danger" title="Выйти">
      <span class="nav-icon">🚪</span> Выйти
    </button>
  </nav>

  <!-- Кнопка-бургер (только на мобильных) -->
  <button id="burger-btn" class="burger-btn" aria-label="Меню">
    <span></span><span></span><span></span>
  </button>
</header>

<!-- Мобильное меню (выезжает справа) -->
<div id="mobile-menu-overlay" class="mobile-overlay hidden"></div>
<aside id="mobile-menu" class="mobile-menu">
  <div class="mobile-menu-header">
    <div id="mobile-user-name" class="user-name"></div>
    <div id="mobile-user-email" class="user-email"></div>
  </div>
  <a href="#/admin" id="mobile-admin-link" class="mobile-link hidden">
    <span>🛡️</span> Админ-панель
  </a>
  <a href="#/reports" class="mobile-link"><span>📊</span> Отчёты</a>
  <a href="#/settings" class="mobile-link"><span>⚙️</span> Настройки</a>
  <button id="mobile-theme-btn" class="mobile-link mobile-btn"><span>🎨</span> Сменить тему</button>
  <button id="mobile-logout-btn" class="mobile-link mobile-btn mobile-danger"><span>🚪</span> Выйти</button>
</aside>

  <!-- Основной контейнер, куда рендерятся экраны -->
  <main id="app"></main>

  <!-- Контейнер для уведомлений -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Контейнер для модальных окон -->
  <div id="modal-root"></div>

  <!-- particles.js (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
  
  <script type="module" src="./scripts/app.js"></script>
</body>
</html>
